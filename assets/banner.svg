<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-15px) scale(1.1);opacity:.7}}@keyframes pulseLine{0%{stroke-dashoffset:400}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.particle{animation:floatParticle 4s ease-in-out infinite}.particle-delayed{animation:floatParticle 5s ease-in-out 2s infinite}.pulse-path{stroke-dasharray:200 200;animation:pulseLine 6s linear infinite}.rotating-ring{transform-origin:1050px 150px;animation:rotateRing 20s linear infinite}</style><rect width="1200" height="300" fill="url(#bg-gradient)" rx="16"/><rect width="1200" height="300" fill="url(#grid)" rx="16"/><g fill="none" stroke="#475569" stroke-opacity=".4" stroke-width="1"><path d="M 100 220 L 250 180 L 400 250 L 600 200 L 800 240 L 950 180 L 1100 230"/><path d="M 150 80 L 300 120 L 500 60 L 750 100 L 900 50 L 1050 90"/><path stroke="#6366f1" stroke-opacity=".8" stroke-width="2" d="M 50 150 Q 300 50 600 150 T 1150 150" class="pulse-path"/></g><circle cx="250" cy="180" r="4" fill="#38bdf8" class="particle"/><circle cx="600" cy="200" r="5" fill="#818cf8" class="particle-delayed"/><circle cx="950" cy="180" r="4" fill="#c084fc" class="particle"/><circle cx="300" cy="120" r="3" fill="#34d399" class="particle-delayed"/><circle cx="750" cy="100" r="4" fill="#fbbf24" class="particle"/><g class="rotating-ring" opacity=".25"><circle cx="1050" cy="150" r="90" fill="none" stroke="#818cf8" stroke-dasharray="12 12" stroke-width="2"/><circle cx="1050" cy="150" r="60" fill="none" stroke="#38bdf8" stroke-dasharray="8 8" stroke-width="1.5"/></g><g transform="translate(80, 55)"><rect width="240" height="32" fill="url(#pill-gradient)" rx="16"/><text x="120" y="21" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">DATA GOVERNANCE &amp; METADATA</text></g><text x="80" y="135" fill="url(#text-gradient)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Awesome Business Glossary Platform</text><text x="80" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">Curated SaaS Products, Enterprise Solutions &amp; Open-Source Metadata Engines</text><g fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" transform="translate(80, 215)"><rect width="130" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="65" y="18" text-anchor="middle">🏷️ Data Catalog</text><rect width="150" height="28" x="142" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="217" y="18" text-anchor="middle">🧠 Business Semantics</text><rect width="140" height="28" x="304" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="374" y="18" text-anchor="middle">🔗 Data Lineage</text><rect width="130" height="28" x="456" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="521" y="18" text-anchor="middle">⚡ Open Source</text></g></svg>