<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pill-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .particle-delayed { animation: floatParticle 5s ease-in-out 2s infinite; }
    .pulse-path {
      stroke-dasharray: 200 200;
      animation: pulseLine 6s linear infinite;
    }
    .rotating-ring {
      transform-origin: 1050px 150px;
      animation: rotateRing 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Background Dynamic Network Nodes & Lines (Kept Behind Text) -->
  <g stroke="#475569" stroke-width="1" stroke-opacity="0.4" fill="none">
    <path d="M 100 220 L 250 180 L 400 250 L 600 200 L 800 240 L 950 180 L 1100 230" />
    <path d="M 150 80 L 300 120 L 500 60 L 750 100 L 900 50 L 1050 90" />
    <path class="pulse-path" stroke="#6366f1" stroke-width="2" stroke-opacity="0.8" d="M 50 150 Q 300 50 600 150 T 1150 150" />
  </g>

  <!-- Animated Floating Glowing Nodes -->
  <circle cx="250" cy="180" r="4" fill="#38bdf8" class="particle" />
  <circle cx="600" cy="200" r="5" fill="#818cf8" class="particle-delayed" />
  <circle cx="950" cy="180" r="4" fill="#c084fc" class="particle" />
  <circle cx="300" cy="120" r="3" fill="#34d399" class="particle-delayed" />
  <circle cx="750" cy="100" r="4" fill="#fbbf24" class="particle" />

  <!-- Abstract Dynamic Graphic (Right Side - Non overlapping) -->
  <g class="rotating-ring" opacity="0.25">
    <circle cx="1050" cy="150" r="90" stroke="#818cf8" stroke-width="2" stroke-dasharray="12 12" fill="none" />
    <circle cx="1050" cy="150" r="60" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" fill="none" />
  </g>

  <!-- Foreground Main Content (Title & Subtitle Guaranteed Clear) -->
  <!-- Tag / Badge -->
  <g transform="translate(80, 55)">
    <rect width="240" height="32" rx="16" fill="url(#pill-gradient)" />
    <text x="120" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      DATA GOVERNANCE &amp; METADATA
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#text-gradient)" filter="url(#glow)">
    Awesome Business Glossary Platform
  </text>

  <!-- Subtitle -->
  <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Curated SaaS Products, Enterprise Solutions &amp; Open-Source Metadata Engines
  </text>

  <!-- Feature Tags -->
  <g transform="translate(80, 215)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="65" y="18" text-anchor="middle">🏷️ Data Catalog</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="217" y="18" text-anchor="middle">🧠 Business Semantics</text>

    <!-- Tag 3 -->
    <rect x="304" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="374" y="18" text-anchor="middle">🔗 Data Lineage</text>

    <!-- Tag 4 -->
    <rect x="456" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="521" y="18" text-anchor="middle">⚡ Open Source</text>
  </g>
</svg>
